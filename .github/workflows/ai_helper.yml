name: AI Helper

# Free AI helper (Gemini key se).
# 1) Koi video workflow fail ho -> wajah dhoondhkar dobara chalata hai ya fix ka PR bhejta hai,
#    aur ek Issue banakar aapko batata hai.
# 2) Issue ya comment mein "@ai <kaam>" likho -> kaam karke PR bhejta hai / jawab deta hai.
on:
  workflow_run:
    workflows: ["Auto Cartoon Katha Shorts", "Auto YouTube Shorts", "Auto Car Gaming Shorts"]
    types: [completed]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  models: read

concurrency:
  group: ai-helper
  cancel-in-progress: false

jobs:
  fix-failed-run:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --upgrade google-genai
      - name: Find cause and fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_AI: ${{ vars.AWS_AI }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python -u ai_helper.py fix

  do-task:
    # Sirf repo ka maalik (aap) "@ai" se kaam de sakta hai.
    if: >-
      (github.event_name == 'issues' &&
       contains(github.event.issue.body, '@ai') &&
       github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@ai') &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --upgrade google-genai
      - name: Do the task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_AI: ${{ vars.AWS_AI }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUEST: ${{ github.event.comment.body || github.event.issue.body }}
        run: python -u ai_helper.py task
