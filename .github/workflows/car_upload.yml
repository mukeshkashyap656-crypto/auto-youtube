name: Auto Car Gaming Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '3 9 * * *' # Dopahar 2:33 PM IST start (~2:40 PM IST upload)

permissions:
  contents: write

jobs:
  build-and-upload-car:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt && pip install --upgrade edge-tts gTTS
      - name: Generate and Upload Car Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_CAR: ${{ secrets.YT_REFRESH_TOKEN_CAR }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -u car.py
      - name: Save Topic History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history_*.json || true
          git commit -m "Update Car topic history" || true
          git pull --rebase || true
          git push || true
